name: Pemeriksaan kualitas

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplikasi:
    name: Aplikasi dan kontrak
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Ambil source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pcntl, posix, redis
          coverage: none
          tools: composer:2.10.2

      - name: Siapkan Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Siapkan environment build non-production
        run: cp .env.example .env

      - name: Validasi manifest dependency
        run: composer validate --no-check-publish

      - name: Pasang dependency PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verifikasi requirement runtime PHP
        run: composer check-platform-reqs

      - name: Pasang dependency Node
        run: npm ci --ignore-scripts

      - name: Siapkan konfigurasi pengujian
        run: php artisan key:generate

      - name: Validasi hardening Docker Compose
        run: npm run infra:validate

      - name: Periksa backend
        run: composer quality

      - name: Periksa frontend dan kontrak API
        run: npm run quality

      - name: Pastikan tipe OpenAPI sinkron
        run: |
          npm run openapi:types
          git diff --exit-code -- resources/js/api/schema.d.ts

      - name: Pasang Chromium untuk smoke test
        # Runner ubuntu-24.04 sudah menyediakan library sistem browser.
        # Hindari --with-deps karena APT mirror eksternal dapat membuat CI timeout.
        run: npx playwright install chromium

      - name: Jalankan smoke test browser
        run: npm run test:e2e

      - name: Audit dependency PHP
        run: composer audit --locked --abandoned=fail

      - name: Audit dependency Node
        run: npm audit --audit-level=high

  keamanan-source:
    name: Vulnerability, secret, dan misconfiguration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Ambil source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pindai repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  infrastruktur:
    name: Bootstrap dan restart infrastruktur
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Ambil source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'

      - name: Bootstrap dari kondisi bersih
        run: sh scripts/bootstrap-local.sh

      - name: Verifikasi endpoint dan security header
        shell: bash
        run: |
          curl --fail --insecure --silent --show-error https://localhost/healthz > /dev/null
          curl --insecure --silent --show-error --dump-header /tmp/arzzaq-headers --output /dev/null https://localhost/
          grep -qi '^content-security-policy:' /tmp/arzzaq-headers
          grep -qi '^permissions-policy:' /tmp/arzzaq-headers
          grep -qi '^x-content-type-options: nosniff' /tmp/arzzaq-headers

      - name: Simulasikan restart stateful service dan queue
        run: |
          docker compose restart postgres redis horizon
          docker compose up --detach --wait
          node scripts/healthcheck.mjs --wait 180

      - name: Tampilkan log ketika gagal
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Bersihkan environment CI
        if: always()
        run: docker compose down --volumes --remove-orphans

  keamanan-container:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - nama: aplikasi
            tag: arzzaq-app:ci
            perintah: docker build --tag arzzaq-app:ci --file Dockerfile .
          - nama: caddy
            tag: arzzaq-caddy:ci
            perintah: docker build --tag arzzaq-caddy:ci --file docker/caddy/Dockerfile .
          - nama: postgres
            tag: arzzaq-postgres:ci
            perintah: docker build --tag arzzaq-postgres:ci --file docker/postgres/Dockerfile .
          - nama: redis
            tag: arzzaq-redis:ci
            perintah: docker build --tag arzzaq-redis:ci --file docker/redis/Dockerfile .
    steps:
      - name: Ambil source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan image ${{ matrix.nama }}
        run: ${{ matrix.perintah }}

      - name: Pindai image lokal
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
