name: Pemeriksaan kualitas

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplikasi:
    name: Aplikasi dan kontrak
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Ambil source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Siapkan PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pcntl, posix, redis
          coverage: none
          tools: composer:2.10.2

      - name: Siapkan Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Siapkan environment build non-production
        run: cp .env.example .env

      - name: Validasi manifest dependency
        run: composer validate --no-check-publish

      - name: Pasang dependency PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verifikasi requirement runtime PHP
        run: composer check-platform-reqs

      - name: Pasang dependency Node
        run: npm ci --ignore-scripts

      - name: Siapkan konfigurasi pengujian
        run: php artisan key:generate

      - name: Periksa backend
        run: composer quality

      - name: Periksa frontend dan kontrak API
        run: npm run quality

      - name: Pastikan tipe OpenAPI sinkron
        run: |
          npm run openapi:types
          git diff --exit-code -- resources/js/api/schema.d.ts

      - name: Pasang Chromium untuk smoke test
        run: npx playwright install --with-deps chromium

      - name: Jalankan smoke test browser
        run: npm run test:e2e

      - name: Audit dependency PHP
        run: composer audit --locked --abandoned=fail

      - name: Audit dependency Node
        run: npm audit --audit-level=high

  keamanan-source:
    name: Vulnerability, secret, dan misconfiguration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Ambil source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Pindai repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  keamanan-container:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Ambil source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Periksa ketersediaan Dockerfile
        id: dockerfile
        shell: bash
        run: |
          if [[ -f Dockerfile ]]; then
            echo "tersedia=true" >> "$GITHUB_OUTPUT"
          else
            echo "tersedia=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bangun image lokal
        if: steps.dockerfile.outputs.tersedia == 'true'
        run: docker build --tag arzzaq:ci .

      - name: Pindai image lokal
        if: steps.dockerfile.outputs.tersedia == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: arzzaq:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Catat status sebelum Fase 2
        if: steps.dockerfile.outputs.tersedia != 'true'
        run: echo "Dockerfile baru dibuat dan dipindai pada Fase 2."
